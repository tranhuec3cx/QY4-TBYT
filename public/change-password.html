<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đổi mật khẩu - QY4 TTBYT</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#17324d;min-height:100vh;display:grid;place-items:center;padding:24px}
    .box{width:min(460px,100%);background:#fff;border:1px solid #d8e1eb;border-radius:16px;padding:30px;box-shadow:0 12px 35px rgba(23,50,77,.10)}
    h1{margin:0 0 8px;font-size:24px}.sub{margin:0 0 22px;color:#60758a;line-height:1.5} label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
    input{width:100%;padding:12px 13px;border:1px solid #bdcbd9;border-radius:9px;font-size:15px;outline:none} button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#244f72;color:#fff;font-weight:700;cursor:pointer}
    .error{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;background:#fff0f0;color:#9e2525;font-size:13px}.hint{font-size:12px;color:#718597;margin-top:5px}.logout{background:#e8eef4;color:#26435d;margin-top:10px}
  </style>
</head>
<body>
  <main class="box">
    <h1>Đổi mật khẩu</h1>
    <p class="sub">Mật khẩu tạm thời phải được thay đổi trước khi tiếp tục sử dụng phần mềm.</p>
    <form id="form">
      <label>Mật khẩu hiện tại</label><input id="current" type="password" autocomplete="current-password" required />
      <label>Mật khẩu mới</label><input id="newPass" type="password" autocomplete="new-password" minlength="10" required /><div class="hint">Tối thiểu 10 ký tự. Nên dùng chữ hoa, chữ thường, số và ký tự đặc biệt.</div>
      <label>Nhập lại mật khẩu mới</label><input id="confirmPass" type="password" autocomplete="new-password" minlength="10" required />
      <button id="saveBtn" type="submit">Đổi mật khẩu</button>
      <button id="logoutBtn" class="logout" type="button">Đăng xuất</button>
      <div id="errorBox" class="error"></div>
    </form>
  </main>
  <script>
    const errorBox=document.getElementById('errorBox');
    function err(v){errorBox.textContent=v;errorBox.style.display='block'}
    async function ensureSession(){const r=await fetch('/api/auth/me');if(!r.ok)location.href='/login.html';}
    document.getElementById('form').addEventListener('submit',async e=>{
      e.preventDefault(); errorBox.style.display='none';
      const a=document.getElementById('newPass').value,b=document.getElementById('confirmPass').value;
      if(a!==b)return err('Hai lần nhập mật khẩu mới chưa khớp.');
      if(a.length<10)return err('Mật khẩu mới phải có ít nhất 10 ký tự.');
      const btn=document.getElementById('saveBtn');btn.disabled=true;
      try{
        const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:document.getElementById('current').value,new_password:a})});
        const data=await r.json().catch(()=>({})); if(!r.ok)throw new Error(data.error||'Không đổi được mật khẩu.');
        alert('Đã đổi mật khẩu.'); location.href='/index.html';
      }catch(e2){err(e2.message||String(e2));}finally{btn.disabled=false;}
    });
    document.getElementById('logoutBtn').onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});}catch{}location.href='/login.html';};
    ensureSession();
  </script>
</body>
</html>
