name: P3 Remove Vulnerable XLSX

on:
  push:
    branches:
      - fix/p3-dependency-modules
    paths:
      - .github/workflows/p3-remove-xlsx.yml

permissions:
  contents: write

jobs:
  remove-xlsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p3-dependency-modules
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Remove vulnerable SheetJS npm package
        run: npm uninstall xlsx --save
      - name: Commit dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "P3: bỏ xlsx, dùng ExcelJS compatibility"
          git push origin HEAD:fix/p3-dependency-modules
