name: P5 Apply QR Hardening

on:
  push:
    branches:
      - fix/p5-qr-public

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P5
        uses: actions/checkout@v4
        with:
          ref: fix/p5-qr-public
      - name: Minimize public API surface and extend tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sec = Path('p2-security.js')
          s = sec.read_text(encoding='utf-8')
          old = 'return pathname === "/qr/png" || pathname === "/qr/checks" || pathname.startsWith("/public/") || pathname === "/system/public-qr-check" || pathname === "/system/qr-origins";'
          new = 'return pathname === "/qr/checks" || pathname.startsWith("/public/");'
          if old in s:
              s = s.replace(old, new, 1)
              sec.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('Không xác định được publicApi P5 để thu hẹp')

          test = Path('test-p2-security.js')
          t = test.read_text(encoding='utf-8')
          marker = 'P5 internal QR helpers require auth'
          if marker not in t:
              anchor = "    assert.equal(publicDevice.id, 1);\n"
              if anchor not in t:
                  raise SystemExit('Không tìm thấy điểm chèn kiểm thử P5')
              addition = '''

              // P5 internal QR helpers require auth: generator và thông tin mạng chỉ dành cho người dùng nội bộ.
              r = await req('/api/qr/png?data=test');
              assert.equal(r.status, 401, 'QR PNG generator không được public');
              r = await req('/api/system/qr-origins');
              assert.equal(r.status, 401, 'Danh sách IP LAN/QR origins không được public');
              r = await req('/api/system/public-qr-check');
              assert.equal(r.status, 401, 'Kiểm tra cấu hình QR public không được public');'''
              t = t.replace(anchor, anchor + addition, 1)
              test.write_text(t, encoding='utf-8')
          PY
      - name: Verify patched security module
        run: |
          node -c p2-security.js
          node -c test-p2-security.js
          npm ci
          npm run test:p2
      - name: Commit P5 hardening
        run: |
          if git diff --quiet -- p2-security.js test-p2-security.js; then
            echo "P5 public surface already minimized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p2-security.js test-p2-security.js
          git commit -m "P5: khóa QR generator và endpoint hệ thống khỏi public"
          git push origin HEAD:fix/p5-qr-public
