name: P8 Consolidate Runtime

on:
  push:
    branches:
      - fix/p8-consolidate-runtime
    paths:
      - 'tools/p8-consolidate-runtime.js'
      - '.github/workflows/p8-consolidate-runtime.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/p8-consolidate-runtime
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Consolidate runtime into server.js
        run: node tools/p8-consolidate-runtime.js
      - name: Syntax check generated server
        run: node -c server.js
      - name: Commit generated server
        run: |
          if git diff --quiet -- server.js; then
            echo 'server.js already consolidated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'P8: hợp nhất P0-P7 trực tiếp vào server.js'
          git push origin HEAD:fix/p8-consolidate-runtime
