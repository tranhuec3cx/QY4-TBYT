name: Apply Device Code Unicode Fix

on:
  push:
    branches:
      - fix/device-code-unicode-get
    paths:
      - .github/workflows/apply-device-code-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-code-unicode-get
          fetch-depth: 0
      - name: Patch server device-code logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text(encoding='utf-8')

          old_norm = '''function normalizeDeviceCode(value, departmentCode = "XX", groupCode = "K") {
            const dept = String(departmentCode || "XX").trim().toUpperCase().replace(/[^A-Z0-9]/g, "") || "XX";
            const group = String(groupCode || "K").trim().toUpperCase().replace(/[^A-Z0-9]/g, "") || "K";
            const raw = String(value || "").trim().toUpperCase();
            let m = raw.match(/^QY4[-.]?([A-Z0-9]+)[-.]([A-Z0-9]+)[-.](\\d{4})$/);
            if (m) return `${m[1]}.${m[2]}.${m[3]}`;
            m = raw.match(/^([A-Z0-9]+)[-.]([A-Z0-9]+)[-.](\\d{4})$/);
            if (m) return `${m[1]}.${m[2]}.${m[3]}`;
            m = raw.match(/(\\d{4})$/);
            if (m) return `${dept}.${group}.${m[1]}`;
            return "";
          }
'''
          new_norm = '''function normalizeDeviceCodePart(value, fallback) {
            const cleaned = String(value || fallback || "")
              .trim()
              .toUpperCase()
              .normalize("NFD")
              .replace(/[\\u0300-\\u036f]/g, "")
              .replace(/[^A-Z0-9Đ]/g, "");
            return cleaned || fallback;
          }

          function normalizeDeviceCode(value, departmentCode = "XX", groupCode = "K") {
            const dept = normalizeDeviceCodePart(departmentCode, "XX");
            const group = normalizeDeviceCodePart(groupCode, "K");
            const raw = String(value || "").trim().toUpperCase();
            let m = raw.match(/^QY4[-.]?([A-Z0-9Đ]+)[-.]([A-Z0-9Đ]+)[-.](\\d{4})$/);
            if (m) return `${m[1]}.${m[2]}.${m[3]}`;
            m = raw.match(/^([A-Z0-9Đ]+)[-.]([A-Z0-9Đ]+)[-.](\\d{4})$/);
            if (m) return `${m[1]}.${m[2]}.${m[3]}`;
            m = raw.match(/(\\d{4})$/);
            if (m) return `${dept}.${group}.${m[1]}`;
            return "";
          }
'''
          if old_norm not in s:
              raise SystemExit('normalizeDeviceCode block not found')
          s = s.replace(old_norm, new_norm, 1)

          old_get = '''function getDeviceCode(id) {
            const row = db.prepare(`SELECT device_code, department_code, group_code FROM devices WHERE id = ?`).get(id);
            if (!row) return "";
            const normalized = normalizeDeviceCode(row.device_code, row.department_code, row.group_code);
            if (normalized) {
              if (normalized !== row.device_code) db.prepare("UPDATE devices SET device_code=? WHERE id=?").run(normalized, id);
              return normalized;
            }
            const code = generateDeviceCode(row.department_code, row.group_code);
            db.prepare("UPDATE devices SET device_code=? WHERE id=?").run(code, id);
            return code;
          }
'''
          new_get = '''function getDeviceCode(id) {
            const row = db.prepare(`SELECT device_code, department_code, group_code FROM devices WHERE id = ?`).get(id);
            if (!row) return "";
            // GET chỉ đọc dữ liệu. Không được UPDATE mã thiết bị trong lúc render/preview,
            // vì chuẩn hóa có thể gây xung đột UNIQUE và làm hỏng cả /api/devices.
            const current = String(row.device_code || "").trim();
            if (current) return current;
            return generateDeviceCode(row.department_code, row.group_code);
          }
'''
          if old_get not in s:
              raise SystemExit('getDeviceCode block not found')
          s = s.replace(old_get, new_get, 1)

          old_gen = '''function generateDeviceCode(departmentCode, groupCode) {
            const dept = String(departmentCode || 'XX').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'XX';
            const group = String(groupCode || 'K').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'K';
            const prefix = `${dept}.${group}.`;
            const rows = db.prepare("SELECT device_code FROM devices WHERE device_code LIKE ? ORDER BY device_code").all(prefix + "%");
            let max = 0;
            for (const r of rows) {
              const normalized = normalizeDeviceCode(r.device_code, dept, group);
              const m = String(normalized || '').match(/\\.(\\d{4})$/);
              if (m) max = Math.max(max, Number(m[1]));
            }
            return `${prefix}${String(max + 1).padStart(4, '0')}`;
          }
'''
          new_gen = '''function generateDeviceCode(departmentCode, groupCode) {
            const dept = normalizeDeviceCodePart(departmentCode, 'XX');
            const group = normalizeDeviceCodePart(groupCode, 'K');
            const prefix = `${dept}.${group}.`;
            const rows = db.prepare("SELECT device_code FROM devices WHERE device_code LIKE ? ORDER BY device_code").all(prefix + "%");
            let max = 0;
            for (const r of rows) {
              const normalized = normalizeDeviceCode(r.device_code, dept, group);
              const m = String(normalized || '').match(/\\.(\\d{4})$/);
              if (m) max = Math.max(max, Number(m[1]));
            }
            let next = max + 1;
            let code = `${prefix}${String(next).padStart(4, '0')}`;
            while (db.prepare("SELECT 1 FROM devices WHERE device_code=? LIMIT 1").get(code)) {
              next += 1;
              code = `${prefix}${String(next).padStart(4, '0')}`;
            }
            return code;
          }
'''
          if old_gen not in s:
              raise SystemExit('generateDeviceCode block not found')
          s = s.replace(old_gen, new_gen, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          node --check server.js
          python - <<'PY'
          from pathlib import Path
          s=Path('server.js').read_text(encoding='utf-8')
          assert '[^A-Z0-9Đ]' in s
          a=s.index('function getDeviceCode')
          b=s.index('function enrichDevice', a)
          assert 'UPDATE devices SET device_code' not in s[a:b]
          assert 'normalizeDeviceCodePart(groupCode' in s
          print('[DEVICE CODE] PASS - Unicode Đ preserved; GET is read-only.')
          PY
      - name: Commit patched server
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "fix: preserve Đ in device codes and make GET read-only"
          git push origin HEAD:fix/device-code-unicode-get
