name: V5 Release Candidate Gate

on:
  push:
    branches:
      - release/v5.0.0-rc1
  pull_request:
    paths:
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'p2-*.js'
      - 'p7-*.js'
      - 'proxy-config.js'
      - 'test-*.js'
      - '.github/workflows/rc-v5.yml'
      - 'RELEASE_CANDIDATE_V5.md'

jobs:
  rc-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Reject runtime/private artifacts in Git
        shell: bash
        run: |
          set -euo pipefail
          BAD="$(git ls-files | grep -E '(^|/)node_modules/|(^|/)uploads/|(^|/)\.env$|\.(sqlite|sqlite-wal|sqlite-shm|sqlite-journal|db|db-wal|db-shm|db-journal)$' || true)"
          if [ -n "$BAD" ]; then
            echo "Không được theo dõi các tệp/thư mục runtime sau:"
            echo "$BAD"
            exit 1
          fi

      - name: Required source structure and official logo
        shell: bash
        run: |
          set -euo pipefail
          test -f server.js
          test -f package.json
          test -d public
          test -f public/index.html
          test -f public/dashboard.html
          test -f public/tickets.html
          test -f public/maintenance.html
          test -f public/inspection.html
          test -f public/inspections.html
          test -f public/reports.html
          test -f public/qr-check.html
          test -s public/assets/BVQY4.jpg
          test "$(git hash-object public/assets/BVQY4.jpg)" = "b6437339d824e0d482cc3dd65299ba71f3ea21d7"
          grep -q '/assets/BVQY4.jpg' public/login.html

      - name: Direct runtime syntax and safety
        run: |
          node -c server.js
          npm run check:safety

      - name: Full automated regression
        run: |
          npm run test:p2
          npm run test:p3:excel
          npm run test:p3:reports
          npm run test:p4:ui
          npm run test:p4:role
          npm run test:p4:dashboard
          npm run test:p4:scope
          npm run test:p5:qr
          npm run test:p6:proxy
          npm run test:p7:qr
          npm run test:p7:client

      - name: Production fresh-install smoke test
        env:
          PORT: '5199'
          DEMO_MODE: 'false'
          ADMIN_INITIAL_PASSWORD: 'RC1-Only-Strong-Password-5199'
          TRUST_PROXY: 'false'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf db uploads
          node server.js > /tmp/qy4-rc-prod.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5199/login.html >/tmp/qy4-login.html 2>/dev/null; then break; fi
            sleep 0.5
          done
          kill -0 "$PID"
          grep -q 'Đăng nhập' /tmp/qy4-login.html
          grep -q '/assets/BVQY4.jpg' /tmp/qy4-login.html
          curl -fsS http://127.0.0.1:5199/assets/BVQY4.jpg -o /tmp/qy4-logo.jpg
          test -s /tmp/qy4-logo.jpg
          test "$(git hash-object /tmp/qy4-logo.jpg)" = "b6437339d824e0d482cc3dd65299ba71f3ea21d7"
          node - <<'NODE'
          const Database = require('better-sqlite3');
          const db = new Database('db/qy4_ttbyt.sqlite', { readonly:true });
          const devices = db.prepare('SELECT COUNT(*) c FROM devices').get().c;
          const departments = db.prepare('SELECT COUNT(*) c FROM departments').get().c;
          const users = db.prepare('SELECT COUNT(*) c FROM users').get().c;
          db.close();
          if (devices !== 0) throw new Error(`Production trắng không được có thiết bị demo: ${devices}`);
          if (departments < 1) throw new Error('Thiếu danh mục khoa/phòng nền.');
          if (users !== 1) throw new Error(`Production ban đầu chỉ được có 01 admin: ${users}`);
          console.log(`[RC PROD] departments=${departments}; users=${users}; devices=${devices}`);
          NODE
          kill "$PID"
          wait "$PID" 2>/dev/null || true
          trap - EXIT
          cat /tmp/qy4-rc-prod.log

      - name: Demo smoke test
        env:
          PORT: '5200'
          DEMO_MODE: 'true'
          ADMIN_INITIAL_PASSWORD: 'RC1-Demo-Strong-Password-5200'
          TRUST_PROXY: 'false'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf db uploads
          node server.js --demo > /tmp/qy4-rc-demo.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5200/login.html >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          kill -0 "$PID"
          node - <<'NODE'
          const Database = require('better-sqlite3');
          const db = new Database('db/qy4_ttbyt.sqlite', { readonly:true });
          const devices = db.prepare('SELECT COUNT(*) c FROM devices').get().c;
          const users = db.prepare('SELECT COUNT(*) c FROM users').get().c;
          db.close();
          if (devices < 1) throw new Error('DEMO_MODE phải có thiết bị mẫu.');
          if (users < 2) throw new Error('DEMO_MODE phải có nhiều hơn 01 user mẫu.');
          console.log(`[RC DEMO] users=${users}; devices=${devices}`);
          NODE
          kill "$PID"
          wait "$PID" 2>/dev/null || true
          trap - EXIT
          cat /tmp/qy4-rc-demo.log
