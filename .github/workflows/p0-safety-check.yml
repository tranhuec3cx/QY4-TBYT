name: P0 Safety Check

on:
  pull_request:
  push:
    branches:
      - fix/p0-safety

jobs:
  check-p0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify P0 source hardening
        run: npm run check:p0
