name: Safety Check P0-P2

on:
  pull_request:
  push:
    branches:
      - fix/p0-safety
      - fix/p1-incident-repair
      - fix/p2-auth-audit

jobs:
  safety-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify P0-P2 source hardening
        run: npm run check:safety
      - name: Integration test P2 auth and scope
        run: npm run test:p2
