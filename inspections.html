<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Kiểm định</title><link rel="stylesheet" href="/styles.css"/></head><body><div class="layout"><div id="menuHost"></div><main class="main"><div class="topbar"><div><h1 id="pageTitle" class="page-title"></h1><p id="pageSubtitle" class="page-subtitle"></p></div></div>
<section class="card"><div class="filters inspection-filter-grid"><label class="field"><span class="field-label">Từ ngày</span><input id="fromDate" type="date"/></label><label class="field"><span class="field-label">Đến ngày</span><input id="toDate" type="date"/></label><input id="searchInput" placeholder="Tìm mã/tên thiết bị, đơn vị kiểm định"/><select id="deviceFilter"></select><select id="typeFilter"><option value="ALL">Tất cả hồ sơ</option><option>Kiểm định</option><option>Hiệu chuẩn</option></select><select id="orgFilter"><option value="ALL">Tất cả đơn vị</option></select><button class="btn" id="filterBtn">Lọc</button><button class="btn btn-primary" onclick="document.getElementById('formCard').scrollIntoView({behavior:'smooth'})">+ Thêm hồ sơ</button></div></section>
<section class="card"><div class="table-card-header"><h3 id="countLabel">0 bản ghi</h3></div><div class="table-wrap scroll-area"><table><thead><tr><th class="col-time">Thời gian</th><th>Mã TB</th><th>Tên thiết bị</th><th class="col-dept">Khoa</th><th>Loại</th><th>Đơn vị kiểm định</th><th>Ngày hết hạn</th><th>Kết quả</th><th>File</th><th class="col-actions">Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div><div class="table-footer-actions"><button class="btn btn-primary" id="exportBtn">Xuất Excel</button></div></section>
<section id="formCard" class="card"><div class="table-card-header"><h3>Phiếu kiểm định</h3></div><form id="form"><input type="hidden" id="recordId"/><div class="form-grid"><label class="field span-3 device-picker-field"><span class="field-label">Thiết bị</span><input id="deviceSearch" list="inspectionDeviceOptions" placeholder="Gõ mã / tên thiết bị / model / Serial Number" autocomplete="off"/><datalist id="inspectionDeviceOptions"></datalist><input type="hidden" id="deviceId" required/></label><input id="dept" readonly placeholder="Khoa"/><input id="location" readonly placeholder="Vị trí"/><select id="type"><option>Kiểm định</option><option>Hiệu chuẩn</option></select><input id="inspectionDate" type="datetime-local" required/><input id="organization" placeholder="Đơn vị thực hiện"/><input id="certificateNo" type="hidden" value=""/><select id="result"><option>Đạt</option><option>Đạt có lưu ý</option><option>Không đạt</option></select><input id="nextDate" type="date"/><input id="fileNote" placeholder="Tên file đính kèm / ghi chú nội bộ"/><input id="fileUpload" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.zip"/><textarea id="note" class="span-3" placeholder="Ghi chú"></textarea></div><div class="form-actions"><button class="btn btn-primary" type="submit">Lưu kiểm định</button><button class="btn" type="button" id="resetBtn">Đặt lại</button></div></form></section>
</main></div><script src="/api.js"></script><script src="/vendor/xlsx.full.min.js"></script><script src="/inspections.js"></script></body></html>
